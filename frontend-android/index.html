<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png?v=5" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme_mode') || localStorage.getItem('theme');
        var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var active = isDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', active);
        document.documentElement.style.colorScheme = active;
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', isDark ? '#080c16' : '#ffffff');
      } catch(e) {}
    })();
  </script>
  <title>Smart Sight</title>
  <!-- Fonts: Inter (Locally Hosted) -->
  <link rel="preload" href="/fonts/Inter-VariableFont_opsz,wght.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="/preloader.css" />

  <!-- Bootstrap Icons Web CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>
  <div id="root">
    <div class="app-preloader">
      <div class="preloader-ambient-aura"></div>
      <div class="preloader-content">
        <div class="preloader-logo-wrap">
          <div class="preloader-logo-card">
            <img src="/app_icon.png" alt="SmartSight" class="preloader-logo" />
          </div>
        </div>
        <h1 class="preloader-brand">Smart <span>Sight</span></h1>
        <div class="preloader-tagline">AI Vision & Access Control</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
