<!doctype html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme_mode') || localStorage.getItem('theme');
        var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var active = isDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', active);
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', isDark ? '#080c16' : '#ffffff');
      } catch(e) {}
    })();
  </script>

    body {

    .app-preloader {

      z-index: 2;

      flex-direction: column;

      justify-content: center;
      text-align: center;
      max-width: 320px;
      width: 100%;
      animation: simpleZoomIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes simpleZoomIn {
      0% {
        opacity: 0;
        transform: scale(0.75);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    .preloader-logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }
    .preloader-logo-card {

      height: 92px;

      overflow: hidden;
      background: var(--preloader-card-bg);

    @keyframes logoPulse {

      }

        transform: scale(1.08);
        box-shadow: 0 0 30px rgba(37, 99, 235, 0.9), 0 0 15px rgba(56, 189, 248, 0.8);

    }
    .preloader-logo {

    .preloader-brand {
