<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png?v=5" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme_mode') || localStorage.getItem('theme');
        var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var active = isDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', active);
        document.documentElement.style.colorScheme = active;
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', isDark ? '#0b0f19' : '#ffffff');
        if (window.electronAPI && typeof window.electronAPI.updateTitleBarTheme === 'function') {
          window.electronAPI.updateTitleBarTheme(active);
        }
      } catch(e) {}
    })();
  </script>
  <title>Smart Sight</title>
  <!-- Google Fonts: Inter (Locally Hosted + Google CDN Fallback) -->
  <link rel="preload" href="/fonts/Inter-latin-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
